name: test
on:
  push:
  pull_request:
jobs:
  unit:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        node: [20, 24]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - run: npm ci
      - run: npm test
      - name: Installer dry run on this OS
        working-directory: .
        shell: bash
        run: |
          node install.mjs --clients agents --app "$(node -p process.execPath)" --shim test/mock-server.mjs --dry-run
